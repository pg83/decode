name: Release

# Every commit on main is a release: four jobs build the four modules
# through IX at the revision pinned in build.sh, one module each, and a
# fifth publishes them together as the next numeric tag.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

# releases are numbered by what exists, so one at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        module: [decode, decode.simd128, pdf, djvu]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned IX revision
        id: ix
        run: echo "rev=$(sed -n 's/^IX_REV=//p' build.sh)" >> "$GITHUB_OUTPUT"

      - name: Check out IX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/ix
          ref: ${{ steps.ix.outputs.rev }}
          path: .ix

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autopoint binaryen binutils bison bzip2 ca-certificates clang cmake curl file flex \
            gettext git gperf gzip imagemagick libarchive-tools libclang-rt-dev lld llvm m4 make \
            meson nasm ninja-build perl pkg-config python3 rsync xz-utils zstd
          magick -version
          wasm-opt --version
          magick -list format | grep -iE '^ +(JPEG|JXL|JP2|PNG|TIFF|WEBP) ' || true

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build ${{ matrix.module }}.wasm through IX
        env:
          IX_FLAGS: all_system=1,intl_ver=no,system_aclocal_path=/usr/share/aclocal
          IX_ROOT: ${{ runner.temp }}/ix
          IX_THREADS: 4
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/diagnostics"
          ./build.sh "${{ matrix.module }}" "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/diagnostics/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log-${{ matrix.module }}
          path: ${{ runner.temp }}/diagnostics/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload the module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-${{ matrix.module }}
          path: ${{ runner.temp }}/out/${{ matrix.module }}.wasm.zstd
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned IX revision
        id: ix
        run: echo "rev=$(sed -n 's/^IX_REV=//p' build.sh)" >> "$GITHUB_OUTPUT"

      - name: Download the modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: module-*
          path: ${{ runner.temp }}/out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/out"
          modules="decode.wasm.zstd decode.simd128.wasm.zstd pdf.wasm.zstd djvu.wasm.zstd"
          ls -la $modules
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq '[.[].tagName | select(test("^[1-9][0-9]*$")) | tonumber] | max // 0')
          tag=$((last + 1))
          sums=$(sha256sum $modules)
          notes="decode, pdf and djvu modules from ix ${{ steps.ix.outputs.rev }}, decode $GITHUB_SHA"
          notes="$notes"$'\n\n'"$sums"
          gh release create "$tag" $modules \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes "$notes"
          echo "released $tag"

      - name: Attest the artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/out/decode.wasm.zstd
            ${{ runner.temp }}/out/decode.simd128.wasm.zstd
            ${{ runner.temp }}/out/pdf.wasm.zstd
            ${{ runner.temp }}/out/djvu.wasm.zstd
