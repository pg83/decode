name: Release

# Every commit on main is a release: build decode.wasm through IX at the
# revision pinned in build.sh, then publish it as the next numeric tag.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

# releases are numbered by what exists, so one at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish decode.wasm
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned IX revision
        id: ix
        run: echo "rev=$(sed -n 's/^IX_REV=//p' build.sh)" >> "$GITHUB_OUTPUT"

      - name: Check out IX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/ix
          ref: ${{ steps.ix.outputs.rev }}
          path: .ix

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf automake autopoint binutils bison bzip2 ca-certificates clang cmake curl \
            file flex gettext git gperf gzip imagemagick libarchive-tools libclang-rt-dev \
            libtool libtool-bin lld llvm m4 make meson nasm ninja-build perl pkg-config \
            python3 rsync xz-utils zstd
          magick -version
          magick -list format | grep -iE '^ +(JPEG|JXL|JP2|PNG|TIFF|WEBP) ' || true

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build decode.wasm through IX
        env:
          IX_FLAGS: all_system=1,intl_ver=no,system_aclocal_path=/usr/share/aclocal
          IX_ROOT: ${{ runner.temp }}/ix
          IX_THREADS: 4
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/diagnostics"
          ./build.sh "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/diagnostics/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: ${{ runner.temp }}/diagnostics/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq '[.[].tagName | select(test("^[1-9][0-9]*$")) | tonumber] | max // 0')
          tag=$((last + 1))
          sum=$(sha256sum "$RUNNER_TEMP/out/decode.wasm.zstd" | cut -d' ' -f1)
          notes="decode.wasm from ix ${{ steps.ix.outputs.rev }}, decode $GITHUB_SHA"
          notes="$notes"$'\n\n'"$sum  decode.wasm.zstd"
          gh release create "$tag" "$RUNNER_TEMP/out/decode.wasm.zstd" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes "$notes"
          echo "released $tag"

      - name: Attest the artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/out/decode.wasm.zstd
